const [lang, setLang] = useState(() => {

useEffect(() => {

                    <header className="fixed top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-7xl px-8 py-4 flex justify-between items-center z-[200] bg-white/70 backdrop-blur-xl rounded-full border border-white/40 shadow-[0_8px_32px_0_rgba(0,0,0,0.05)]">
                        <div className="flex items-center gap-8">

            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PoliciesApp />);
    </script>
</body>
</html>
