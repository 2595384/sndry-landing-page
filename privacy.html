<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta property="og:title" content="SNDRY GROUP | بوابتك للتحول الرقمي">

<meta property="og:type" content="website">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سياسة الخصوصية | SNDRY GROUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fafafa; color: #1a1a1a; margin: 0; overflow-x: hidden; }
        .legal-card { 
            background: #ffffff; border-radius: 32px; padding: 4rem; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.03); 
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .legal-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function PrivacyApp() {
            // بنسحب اللغة من المتصفح لو موجودة، ولو مش موجودة بنخليها عربي
const [lang, setLang] = useState(() => {
    return localStorage.getItem('sndry_lang') || 'ar';
});
useEffect(() => {
    localStorage.setItem('sndry_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
}, [lang]);

            // المحتوى الحرفي المأخوذ من ملف Privacy.jsx
            const translations = {
                ar: {
                    dir: 'rtl',
                    switch: 'English',
                    back: '← العودة للرئيسية',
                    title: 'سياسة الخصوصية',
                    subtitle: 'نحن نحترم خصوصيتك بالكامل. لا نقوم ببيع بياناتك، ولا نستغلها لأهداف إعلانية مخفية. هذه هي التفاصيل.',
                    sections: [
                        {
                            title: 'هويتنا والجهة المسؤولة',
                            desc: 'تشير "نحن" أو "لنا" إلى SNDRY GROUP. فعندما تستخدم منتجاتنا (مثل SNDRY ERP، SAMI، SNDRY POS)، نقوم بجمع الحد الأدنى من المعلومات اللازمة لتقديم خدمتك ومساعدتك. نحن لا نبيع أسرارك.'
                        },
                        {
                            title: 'ما هي البيانات التي نجمعها؟',
                            desc: 'نقوم فقط بجمع المعلومات الضرورية لتشغيل حسابك وصيانته، مثل اسمك وبريدك الإلكتروني، وبيانات الفواتير الأساسية للعملاء المدفوعين. جميع اتصالاتك، ملفاتك، ومسوداتك داخل منتجاتنا هي بياناتك الخاصة بالكامل؛ ولا نطلع عليها أبداً إلا بموافقة صريحة منك لغرض الدعم الفني الطارئ.'
                        },
                        {
                            title: 'متى وكيف يمكننا الوصول إلى بياناتك؟',
                            desc: 'خصوصيتك مقدسة. الحالات الوحيدة التي قد يصل فيها مهندسونا إلى بياناتك هي: طلبك المباشر للدعم الفني (حيث نطلب إذنك صراحة)، أو للتحقيق في خطأ برمجي يعيق النظام، أو للحفاظ على أمان المنصة ضد الاختراقات الأمنية والمحاولات الخبيثة.'
                        },
                        {
                            title: 'لا للبيانات المُباعة',
                            desc: 'نموذج أعمالنا وتوجهنا الداخلي يعتمد على جودة المنتج والاشتراكات. نحن لسنا منصة إعلانات. وعليه، فإننا نضمن لك تماماً عدم تأجير، بيع، أو مشاركة بياناتك أو سلوك الاستخدام الخاص بك لأي وكالات إعلانية أو جهات تسويق لطرف ثالث تحت أي ظرف كان.'
                        },
                        {
                            title: 'حذف البيانات واستعادتها',
                            desc: 'بمجرد قيامك بإلغاء اشتراكك، تصبح بياناتك غير قابلة للوصول فوراً للعموم. نقوم بحذف محتويات حسابك بشكل دائم من الخوادم النشطة خلال 30 يوماً، وتُمسح من النسخ الاحتياطية تلقائياً خلال 60 يوماً كحد أقصى. بمجرد الحذف الدائم، لا يمكن استعادة أي معلومات.'
                        },
                        {
                            title: 'تحديثات السياسة',
                            desc: 'نحتفظ بالحق في إجراء تغييرات ضرورية على سياسة الخصوصية بما يتماشى مع الأنظمة أو التحسينات الأمنية. وفي حال حدوث تغييرات جذرية تؤثر على حقوقك، سنقوم بتبليغك مباشرة.'
                        },
                        {
                            title: 'التواصل',
                            desc: 'للأسئلة أو لممارسة حقوق الخصوصية الخاصة بك، يُرجى التواصل عبر البريد الإلكتروني:'
                        }
                    ]
                },
                en: {
                    dir: 'ltr',
                    switch: 'عربي',
                    back: '← Back to Home',
                    title: 'Privacy Policy',
                    subtitle: 'We completely respect your privacy. We do not sell your data, nor do we exploit it for hidden advertising. Here are the details.',
                    sections: [
                        {
                            title: 'Who We Are',
                            desc: '"We", "Our", or "Us" refers to SNDRY GROUP. When you use our products (like SNDRY ERP, SAMI, SNDRY POS), we collect the bare minimum information needed to serve you. We do not sell your secrets.'
                        },
                        {
                            title: 'What Data We Collect',
                            desc: 'We only collect necessary information to operate and maintain your account, such as your name, email, and basic billing data for paid customers. All your communications, files, and drafts inside our products are your exclusive property; we never look at them unless you give us explicit permission for emergency troubleshooting.'
                        },
                        {
                            title: 'When and How We Access Your Data',
                            desc: 'Your privacy is sacred. The only cases where our engineers might access your data are: your direct request for support (where we ask for explicit consent), investigating a critical system-crashing bug, or securing the platform against malicious security breaches.'
                        },
                        {
                            title: 'No Data Selling',
                            desc: 'Our business model and internal philosophy rely on product quality and subscriptions. We are not an advertising platform. Therefore, we absolutely guarantee never to rent, sell, or share your data or usage behavior with any advertising agencies or third-party marketers under any circumstances.'
                        },
                        {
                            title: 'Data Deletion and Recovery',
                            desc: 'Once you cancel your subscription, your data becomes immediately inaccessible to the public. We permanently delete your account contents from active servers within 30 days, and it is automatically purged from backups within a maximum of 60 days. Once permanently deleted, the information cannot be recovered.'
                        },
                        {
                            title: 'Policy Updates',
                            desc: 'We reserve the right to make necessary changes to the privacy policy in accordance with regulations or security improvements. In the case of significant changes affecting your rights, we will notify you directly.'
                        },
                        {
                            title: 'Contact Us',
                            desc: 'For questions or to exercise your privacy rights, please contact us via email:'
                        }
                    ]
                }
            };

            const t = translations[lang];

            useEffect(() => {
                document.documentElement.dir = t.dir;
                document.documentElement.lang = lang;
            }, [lang, t.dir]);

            return (
                <div className="min-h-screen pb-32">
                    
                    {/* الهيدر العائم الفخم (Floating Header) */}
                    <header className="fixed top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-7xl px-8 py-4 flex justify-between items-center z-[200] bg-white/70 backdrop-blur-xl rounded-full border border-white/40 shadow-[0_8px_32px_0_rgba(0,0,0,0.05)]">
                        <div className="flex items-center gap-8">
                            <a href="index.html" className="text-xs font-black opacity-50 hover:opacity-100 transition-opacity">
                                {t.back}
                            </a>
                            <div className="hidden md:block w-px h-6 bg-gray-300"></div>
                            <img src="/sndry-logo-d.png" alt="SNDRY" className="h-6 md:h-8 w-auto opacity-30" />
                        </div>
                        
                        {/* زر تبديل اللغة */}
                        <button 
                            onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} 
                            className="px-6 py-2 rounded-full bg-black text-white text-[10px] font-black uppercase tracking-widest transition-all hover:scale-105"
                        >
                            {t.switch}
                        </button>
                    </header>

                    {/* المحتوى الرئيسي */}
                    <main className="max-w-4xl mx-auto px-6 pt-48">
                        <div className="text-center mb-24">
                            <h1 className="text-5xl md:text-7xl font-black mb-8 tracking-tighter text-gray-900">{t.title}</h1>
                            <p className="text-xl md:text-2xl text-gray-500 font-medium leading-relaxed max-w-2xl mx-auto">
                                {t.subtitle}
                            </p>
                        </div>

                        <div className="space-y-10">
                            {t.sections.map((sec, index) => (
                                <section key={index} className="legal-card">
                                    <h2 className="text-3xl font-black mb-6 text-gray-900">{sec.title}</h2>
                                    <p className="text-xl text-gray-500 leading-relaxed font-medium">
                                        {sec.desc}
                                    </p>
                                    
                                    {/* زر الإيميل يظهر فقط في القسم الأخير (التواصل) */}
                                    {index === t.sections.length - 1 && (
                                        <a href="mailto:info@sndry.net" className="inline-block mt-8 text-2xl font-black text-black border-b-2 border-black pb-1 hover:text-blue-600 hover:border-blue-600 transition-colors">
                                            info@sndry.net
                                        </a>
                                    )}
                                </section>
                            ))}
                        </div>
                    </main>

                    {/* الفوتر */}
                    <footer className="mt-32 text-center">
                        <div className="h-px w-20 bg-gray-200 mx-auto mb-10"></div>
                        <p className="text-gray-400 font-black tracking-[0.5em] text-[10px] uppercase">
                            SNDRY GROUP PRIVACY • 2026
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PrivacyApp />);
    </script>
</body>
</html>
